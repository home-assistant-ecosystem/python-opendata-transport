[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python_opendata_transport"
version = "0.6.2"
description = "Python API for interacting with transport.opendata.ch."
readme = "README.rst"
license = { text = "MIT" }
authors = [
  { name = "Fabian Affolter", email = "fabian@affolter-engineering.ch" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
requires-python = ">=3.13"

dependencies = [
  "aiohttp>=3.8.5,<4",
  "urllib3",
]

[project.optional-dependencies]
test = [
  "pytest>=9",
  "pytest-asyncio>=0.21",
]

[tool.hatch.envs.test]
dependencies = [
  "pytest>=9",
  "pytest-asyncio>=0.21",
  "aiohttp>=3.8.4,<4"
]

[tool.hatch.envs.test.scripts]
run = "pytest"

[tool.hatch.build.targets.wheel]
packages = ["opendata_transport"]

[project.urls]
Homepage = "https://github.com/home-assistant-ecosystem/python-opendata-transport"
"Download URL" = "https://github.com/home-assistant-ecosystem/python-opendata-transport/releases"
